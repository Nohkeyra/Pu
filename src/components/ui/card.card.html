<!-- @dsCard group="Components" viewport="700x180" subtitle="Structural surface with header, body & footer" name="Card" -->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      color: var(--color-text, #1A1816);
      display: flex;
      align-items: center;
      gap: 16px;
      box-sizing: border-box;
    }
    .card {
      flex: 1;
      border-radius: var(--radius-lg, 8px);
      padding: 16px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .card-default {
      background: var(--color-surface, #FAF7F1);
      border: 1px solid var(--color-border, #E8E2D6);
      box-shadow: var(--shadow-xs, 0 1px 2px rgba(26,24,22,0.04));
    }
    .card-outlined {
      background: var(--color-bg, #FFFFFF);
      border: 1px solid var(--color-border-strong, #D4CCBC);
    }
    .card-elevated {
      background: var(--color-surface, #FAF7F1);
      border: 1px solid var(--color-border, #E8E2D6);
      box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(26,24,22,0.08));
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: var(--color-text, #1A1816);
    }
    .card-desc {
      font-size: 13px;
      color: var(--color-text-soft, #6B6560);
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card card-default">
    <h4 class="card-title">Default Card</h4>
    <p class="card-desc">Surface tone with subtle border and slight elevation.</p>
  </div>
  <div class="card card-outlined">
    <h4 class="card-title">Outlined Card</h4>
    <p class="card-desc">Pure white canvas with reinforced boundary border.</p>
  </div>
  <div class="card card-elevated">
    <h4 class="card-title">Elevated Card</h4>
    <p class="card-desc">Floating aesthetic with soft ambient shadow.</p>
  </div>
</body>
</html>
