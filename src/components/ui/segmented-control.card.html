<!-- @dsCard group="Components" viewport="700x180" subtitle="Mutually exclusive segmented tab and toggle control" name="SegmentedControl" -->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      color: var(--color-text, #1A1816);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .segmented-control {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border-radius: var(--radius-xl, 12px);
      background: var(--color-surface-muted, #F2EDE3);
      user-select: none;
      box-sizing: border-box;
    }
    .segmented-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: var(--radius-lg, 8px);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-soft, #6B6560);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .segmented-item:hover {
      color: var(--color-text, #1A1816);
    }
    .segmented-item.active {
      background: var(--color-bg, #FFFFFF);
      color: var(--color-text, #1A1816);
      font-weight: 700;
      box-shadow: var(--shadow-xs, 0 1px 2px rgba(26,24,22,0.04));
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="segmented-control" role="tablist">
      <button type="button" class="segmented-item active">English</button>
      <button type="button" class="segmented-item">Melayu</button>
    </div>

    <div class="segmented-control" role="tablist">
      <button type="button" class="segmented-item active">UI</button>
      <button type="button" class="segmented-item">Updates</button>
      <button type="button" class="segmented-item">Diagnostics</button>
    </div>
  </div>
</body>
</html>
