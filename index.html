<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#211A19" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wawasan" />

    <!-- Web App & Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="/assets/icons/icon-192.webp" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.webp" />

    <title>Wawasan Pak Usop</title>
    <meta name="description" content="A professional web application for Restoran Wawasan Pak Usop, featuring online ordering, dynamic PDF invoice generation, and an administrative dashboard." />

    <!-- Open Graph -->
    <meta property="og:title" content="Wawasan Pak Usop" />
    <meta property="og:description" content="A professional web application for Restoran Wawasan Pak Usop, featuring online ordering, dynamic PDF invoice generation, and an administrative dashboard." />
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="en_MY" />

    <!-- Original brand and UI fonts are bundled locally for consistent offline rendering. -->
    <link rel="preload" as="image" href="/assets/heritage/batik_vector_pattern.jpg" fetchpriority="high" />

  </head>
  <body>
    <div id="root" tabindex="-1"></div>
    <script>
      // Set the persisted theme before React mounts to prevent a palette flash.
      (function () {
        var mode = 'dark';
        try { if (localStorage.getItem('app_theme') === 'light') mode = 'light'; } catch (_) {}
        document.documentElement.classList.add(mode);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', mode === 'dark' ? '#211A19' : '#FFF8EC');
      })();
      // Startup failure must remain legible even when the bundle cannot load.
      // Never interpolate an exception message into innerHTML.
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || root.childElementCount !== 0) return;
        var wrapper = document.createElement('section');
        wrapper.style.cssText = 'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;background:var(--ui-canvas,#211A19);color:var(--ui-ink,#FFB02E)';
        var heading = document.createElement('h1');
        heading.textContent = 'App failed to start';
        heading.style.cssText = 'font-size:18px;font-weight:700;margin:0 0 8px';
        var details = document.createElement('pre');
        details.textContent = (event.message || 'Unknown error') + (event.filename ? ('\n' + event.filename + ':' + event.lineno) : '');
        details.style.cssText = 'font-size:12px;text-align:left;max-width:100%;overflow:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--ui-border,#FFB02E);border-radius:12px;padding:12px;background:var(--ui-surface,#211A19);color:inherit';
        wrapper.append(heading, details);
        root.replaceChildren(wrapper);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
