<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c453c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wawasan" />

    <!-- Web App & Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="/assets/icons/icon-192.webp" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.webp" />

    <title>Wawasan Pak Usop</title>
    <meta name="description" content="A professional web application for Restoran Wawasan Pak Usop, featuring online ordering, dynamic PDF invoice generation, and an administrative dashboard." />

    <!-- Open Graph -->
    <meta property="og:title" content="Wawasan Pak Usop" />
    <meta property="og:description" content="A professional web application for Restoran Wawasan Pak Usop, featuring online ordering, dynamic PDF invoice generation, and an administrative dashboard." />
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="en_MY" />

    <!-- Performance Resource Hints & Non-blocking Google Fonts with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/assets/batik_vector_pattern.jpg" fetchpriority="high" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Permanent+Marker&family=Sedgwick+Ave+Display&family=Uncial+Antiqua&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Permanent+Marker&family=Sedgwick+Ave+Display&family=Uncial+Antiqua&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Permanent+Marker&family=Sedgwick+Ave+Display&family=Uncial+Antiqua&display=swap"
        rel="stylesheet"
      />
    </noscript>

  </head>
  <body>
    <div id="root" tabindex="-1"></div>
    <script>
      // Safety net: if module init throws before React can mount (e.g. a
      // top-level throw in firebaseConfig.ts), show the real error instead
      // of leaving a blank screen. This does NOT fire once React is mounted
      // and its own ErrorBoundary is active.
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;background:#ffffff;">' +
            '<h1 style="font-size:18px;font-weight:700;color:#0c453c;margin-bottom:8px;">App failed to start</h1>' +
            '<pre style="font-size:12px;color:rgba(12,69,60,0.85);background:#ffffff;border:1px solid rgba(246,153,19,0.30);border-radius:12px;padding:12px;max-width:100%;overflow:auto;text-align:left;white-space:pre-wrap;word-break:break-word;">' +
            (e && e.message ? e.message : 'Unknown error') +
            (e && e.filename ? ('\n' + e.filename + ':' + e.lineno) : '') +
            '</pre>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
