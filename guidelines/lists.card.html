<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border, #E8E2D6);
    }
  </style>
</head>
<body>
  <div class="item">
    <span style="font-weight: 600;">Nasi Briyani Kambing</span>
    <span style="font-weight: 700; color: #0C453C;">RM 18.00</span>
  </div>
  <div class="item">
    <span style="font-weight: 600;">Ayam Masak Merah</span>
    <span style="font-weight: 700; color: #0C453C;">RM 12.00</span>
  </div>
</body>
</html>
