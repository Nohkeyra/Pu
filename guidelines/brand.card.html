<!-- @dsCard group="Guidelines" viewport="800x260" subtitle="Visual identity, tagline, and typographic brand signature" name="Brand Foundations" -->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      color: var(--color-text, #1A1816);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }
    .brand-hero {
      background: #0C453C;
      color: #FFFFFF;
      padding: 24px;
      border-radius: var(--radius-lg, 8px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-tagline {
      font-size: 13px;
      color: #C2932D;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="brand-hero">
    <span class="brand-name">RESTORAN WAWASAN PAK USOP</span>
    <span class="brand-tagline">Warisan Katering Melayu Asli Sejak 1986</span>
  </div>
</body>
</html>
