<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }
    .banner {
      padding: 12px 16px;
      border-radius: var(--radius-md, 6px);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .banner-info {
      background: rgba(194, 147, 45, 0.1);
      color: #9A721D;
      border: 1px solid rgba(194, 147, 45, 0.2);
    }
  </style>
</head>
<body>
  <div class="banner banner-info">
    <span>Pesanan anda sedang diproses oleh pihak katering Wawasan.</span>
  </div>
</body>
</html>
