<!-- @dsCard group="Guidelines" viewport="800x320" subtitle="Typographic scale, weights, and baseline readability" name="Typography Scale" -->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      color: var(--color-text, #1A1816);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }
    .spec-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border, #E8E2D6);
      padding-bottom: 6px;
    }
    .label {
      font-size: 11px;
      font-family: monospace;
      color: var(--color-text-muted, #70685C);
    }
  </style>
</head>
<body>
  <div class="spec-item">
    <span style="font-size: 30px; font-weight: 800; line-height: 1.2;">Heading 1 (30px / 800)</span>
    <span class="label">Display / Hero</span>
  </div>
  <div class="spec-item">
    <span style="font-size: 24px; font-weight: 700; line-height: 1.3;">Heading 2 (24px / 700)</span>
    <span class="label">Section Titles</span>
  </div>
  <div class="spec-item">
    <span style="font-size: 18px; font-weight: 600; line-height: 1.4;">Heading 3 (18px / 600)</span>
    <span class="label">Card Headers</span>
  </div>
  <div class="spec-item">
    <span style="font-size: 16px; font-weight: 400; line-height: 1.5;">Body Standard (16px / 400)</span>
    <span class="label">Paragraph / Content</span>
  </div>
  <div class="spec-item">
    <span style="font-size: 14px; font-weight: 500; line-height: 1.5;">Body Small (14px / 500)</span>
    <span class="label">Secondary / Buttons</span>
  </div>
  <div class="spec-item">
    <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Microcopy & Badge (12px / 700)</span>
    <span class="label">Labels / Badges</span>
  </div>
</body>
</html>
