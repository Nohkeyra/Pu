<!-- @dsCard group="Guidelines" viewport="800x260" subtitle="Data metrics and key performance indicators" name="Stat Cards" -->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      display: flex;
      gap: 16px;
      box-sizing: border-box;
    }
    .stat {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius-lg, 8px);
      background: var(--color-surface, #FAF7F1);
      border: 1px solid var(--color-border, #E8E2D6);
    }
    .val {
      font-size: 24px;
      font-weight: 800;
      color: #0C453C;
    }
    .lbl {
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="stat">
    <div class="val">142</div>
    <div class="lbl">Jumlah Tempahan</div>
  </div>
  <div class="stat">
    <div class="val">RM 14,850</div>
    <div class="lbl">Jumlah Hasil</div>
  </div>
</body>
</html>
