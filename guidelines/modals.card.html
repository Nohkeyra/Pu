<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .modal {
      background: #FFFFFF;
      padding: 20px;
      border-radius: var(--radius-xl, 12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 320px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="modal">
    <h4 style="margin: 0 0 8px 0;">Sahkan Tindakan</h4>
    <p style="margin: 0 0 16px 0; font-size: 13px; color: #666;">Adakah anda pasti mahu menyimpan tetapan ini?</p>
  </div>
</body>
</html>
