<!-- @dsCard group="Guidelines" viewport="800x260" subtitle="Interactive forms, focus rings, and input states" name="Form Controls" -->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      color: var(--color-text, #1A1816);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .label {
      font-size: 13px;
      font-weight: 600;
    }
    .input {
      height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-md, 6px);
      border: 1px solid var(--color-border-strong, #D4CCBC);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    .input:focus {
      border-color: var(--color-sunshine-cta, #C2932D);
      box-shadow: 0 0 0 2px rgba(194, 147, 45, 0.2);
    }
  </style>
</head>
<body>
  <div class="form-grid">
    <div class="field">
      <label class="label">Nama Penuh</label>
      <input class="input" type="text" placeholder="Cth: Ahmad Albab" value="Ahmad Albab">
    </div>
    <div class="field">
      <label class="label">Nombor Telefon</label>
      <input class="input" type="text" placeholder="Cth: 012-3456789">
    </div>
  </div>
</body>
</html>
