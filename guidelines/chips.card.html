<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--color-bg, #FFFFFF);
      display: flex;
      gap: 8px;
      align-items: center;
      box-sizing: border-box;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--color-border, #E8E2D6);
      background: var(--color-surface, #FAF7F1);
      cursor: pointer;
    }
    .chip-active {
      background: var(--color-sunshine-cta, #C2932D);
      color: #FFFFFF;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <div class="chip chip-active">Semua</div>
  <div class="chip">Sarapan</div>
  <div class="chip">Makan Tengahari</div>
  <div class="chip">Minuman</div>
</body>
</html>
