name: Deploy to Registry

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1019707766959/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@restoran-wawasan.iam.gserviceaccount.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: asia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            asia-southeast1-docker.pkg.dev/restoran-wawasan/pu-pos-registry/pu-pos:latest
            asia-southeast1-docker.pkg.dev/restoran-wawasan/pu-pos-registry/pu-pos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
