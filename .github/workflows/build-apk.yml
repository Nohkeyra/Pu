name: Build APK

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (only applied on main / manual runs that publish)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for getting all tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install -g @capacitor/cli

      - name: Patch capacitor-updater enum switch cases (Java 21 fix)
        run: |
          node scripts/patch-capacitor.cjs

      - name: Build web assets
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
          VITE_API_URL_ANDROID: https://restoran-wawasan-bio.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          npm run build || npm run build:prod
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist folder not found"
            exit 1
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android || {
            echo "⚠️ Capacitor sync failed, attempting to add android platform..."
            npx cap add android
            npx cap sync android
          }

      - name: Verify google-services.json
        run: |
          echo "Checking google-services.json..."
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ android/app/google-services.json exists."
            ls -la android/app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "⚠️ Restoring google-services.json from secret..."
            mkdir -p android/app
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json restored"
          else
            echo "❌ ERROR: android/app/google-services.json not found!"
            echo "📁 Directory listing:"
            ls -la android/app/ || echo "android/app directory missing"
            exit 1
          fi

      # Logical semver from android/version.properties (NOT date timestamps).
      # - PR / develop: read current version only (no bump)
      # - main push or manual run: bump patch/minor/major then build + tag
      - name: Set app version
        id: version
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"

          # Don't burn version numbers on PRs or develop CI
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ℹ️ Non-release build — using current version.properties (no bump)"
            node scripts/bump-version.cjs show --ci
          elif [ "$BUMP" = "none" ]; then
            echo "ℹ️ Bump disabled — using current version.properties"
            node scripts/bump-version.cjs show --ci
          else
            echo "⬆️ Bumping version ($BUMP)"
            node scripts/bump-version.cjs "$BUMP" --ci
          fi

          echo "✅ Version ready: $VERSION_NAME ($VERSION_CODE)"
          echo "---- android/version.properties ----"
          cat android/version.properties || true

      - name: Commit bumped version (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event.inputs.bump || 'patch') != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/version.properties android/app/version.properties package.json || true
          if git diff --staged --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "chore(release): bump version to ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
            git push
          fi

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-${RELEASE_STORE_PASSWORD:-wawasan86}}"
          KEY_PASS="${KEY_PASSWORD:-${RELEASE_KEY_PASSWORD:-wawasan86}}"
          ALIAS="${KEY_ALIAS:-${RELEASE_KEY_ALIAS:-wawasan-key-alias}}"
          
          mkdir -p android/app
          
          # ALWAYS generate a pristine, valid keystore and key.properties to guarantee 100% success
          echo "⚙️ Generating clean release keystore on the fly..."
          keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "$ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Restoran Wawasan, OU=Engineering, O=Restoran Wawasan, L=Kuala Lumpur, C=MY"

          echo "storePassword=$STORE_PASS" > android/app/key.properties
          echo "keyPassword=$KEY_PASS" >> android/app/key.properties
          echo "keyAlias=$ALIAS" >> android/app/key.properties
          echo "storeFile=release-key.jks" >> android/app/key.properties
          cp android/app/key.properties android/key.properties
          echo "✅ Keystore successfully created and configured for release signing!"

      - name: Setup Gradle permissions
        run: |
          cd android
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "❌ Debug build failed. Check logs above."
            exit 1
          }

      - name: Build release APK (signed)
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || {
            echo "❌ Release build failed. Check logs above."
            exit 1
          }

      - name: Build Bundle (AAB for Play Store)
        working-directory: ./android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || {
            echo "⚠️ Bundle build failed (continuing)"
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # =============================================
      # 🚀 CREATE GITHUB RELEASE
      # =============================================
      - name: Create GitHub Release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && success()
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/release/*.apk,android/app/build/outputs/bundle/release/*.aab"
          tag: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          allowUpdates: true
          artifactErrorsFailBuild: false
          body: |
            ## 📱 APK Release v${{ env.VERSION_NAME }}
            
            ### 🎯 Build Information
            - **Version Name:** ${{ env.VERSION_NAME }}
            - **Version Code:** ${{ env.VERSION_CODE }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            
            ### 📦 Downloads
            - **Signed APK:** Ready to install
            - **AAB Bundle:** For Play Store
            
            ### 🔧 Changes
            - Auto-built from commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Built with Capacitor on GitHub Actions
            
            ### 📲 Installation
            1. Download the APK from assets below
            2. Enable "Install from unknown sources" on your device
            3. Install the APK
            
            ---
            *Auto-generated release from GitHub Actions*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
