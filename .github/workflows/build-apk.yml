name: Build APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for getting all tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install -g @capacitor/cli

      - name: Patch capacitor-updater enum switch cases (Java 17 fix)
        run: |
          UPDATER_PATH="node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/DelayUpdateUtils.java"
          if [ -f "$UPDATER_PATH" ]; then
            echo "🔧 Patching capacitor-updater enum switch cases for Java 17 compatibility..."
            sed -i 's/case DelayUntilNext\.background:/case background:/g' "$UPDATER_PATH"
            sed -i 's/case DelayUntilNext\.kill:/case kill:/g' "$UPDATER_PATH"
            sed -i 's/case DelayUntilNext\.date:/case date:/g' "$UPDATER_PATH"
            sed -i 's/case DelayUntilNext\.nativeVersion:/case nativeVersion:/g' "$UPDATER_PATH"
            echo "✅ Successfully patched all 4 enum switch cases"
          else
            echo "⚠️ capacitor-updater file not found at expected path, skipping patch"
          fi

      - name: Build web assets
        env:
          VITE_API_URL_ANDROID: https://restoran-wawasan-bio.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          npm run build || npm run build:prod
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist folder not found"
            exit 1
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android || {
            echo "⚠️ Capacitor sync failed, attempting to add android platform..."
            npx cap add android
            npx cap sync android
          }

      - name: Verify google-services.json
        run: |
          echo "Checking google-services.json..."
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ android/app/google-services.json exists."
            ls -la android/app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "⚠️ Restoring google-services.json from secret..."
            mkdir -p android/app
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json restored"
          else
            echo "❌ ERROR: android/app/google-services.json not found!"
            echo "📁 Directory listing:"
            ls -la android/app/ || echo "android/app directory missing"
            exit 1
          fi

      - name: Set app version
        id: version
        run: |
          VERSION_CODE=$(date +'%Y%m%d%H%M')
          VERSION_NAME=$(date +'%Y.%m.%d-%H%M')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ Version set to: $VERSION_NAME ($VERSION_CODE)"

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Decoding provided keystore..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            chmod 600 android/app/release-key.jks
            echo "✅ Keystore saved to android/app/release-key.jks"
            
            # Create keystore properties
            echo "storePassword=$KEYSTORE_PASSWORD" > android/app/keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/app/keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> android/app/keystore.properties
            echo "storeFile=release-key.jks" >> android/app/keystore.properties

            # Create key.properties (read by android/app/build.gradle)
            echo "storePassword=$KEYSTORE_PASSWORD" > android/app/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/app/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/app/key.properties
            echo "storeFile=release-key.jks" >> android/app/key.properties
            cp android/app/key.properties android/key.properties
            
            echo "✅ Keystore configured for signing"
          else
            echo "⚠️ WARNING: ANDROID_KEYSTORE_BASE64 secret is not configured in GitHub Secrets."
            echo "Release signing will be skipped; debug APK will still be produced."
            mkdir -p android/app
            touch android/app/key.properties
            touch android/key.properties
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle permissions
        run: |
          cd android
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --stacktrace || {
            echo "❌ Debug build failed. Check logs above."
            exit 1
          }

      - name: Build release APK (signed)
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --stacktrace || {
            echo "❌ Release build failed. Check logs above."
            exit 1
          }

      - name: Build Bundle (AAB for Play Store)
        working-directory: ./android
        run: |
          ./gradlew bundleRelease --stacktrace || {
            echo "⚠️ Bundle build failed (continuing)"
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # =============================================
      # 🚀 CREATE GITHUB RELEASE
      # =============================================
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android/app/build/outputs/apk/release/*.apk,android/app/build/outputs/bundle/release/*.aab"
          tag: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          body: |
            ## 📱 APK Release v${{ env.VERSION_NAME }}
            
            ### 🎯 Build Information
            - **Version Code:** ${{ env.VERSION_CODE }}
            - **Build Date:** ${{ env.VERSION_NAME }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            
            ### 📦 Downloads
            - **Signed APK:** Ready to install
            - **AAB Bundle:** For Play Store
            
            ### 🔧 Changes
            - Auto-built from commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Built with Capacitor on GitHub Actions
            
            ### 📲 Installation
            1. Download the APK from assets below
            2. Enable "Install from unknown sources" on your device
            3. Install the APK
            
            ---
            *Auto-generated release from GitHub Actions*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # =============================================
      # 💬 PR COMMENT
      # =============================================
      - name: Comment PR with artifacts
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const issueNumber = context.issue && context.issue.number;
            if (issueNumber) {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: repo.owner,
                repo: repo.repo,
                body: `✅ **APK Build Successful!** (Build #${runId})
                
                📦 **Available Artifacts:**
                - **Debug APK:** \`app-debug.apk\`
                - **Signed Release APK:** \`app-release-signed.apk\`
                - **Bundle (AAB):** \`app-release.aab\`
                
                🔗 **Download:** Go to **Actions** → Select this workflow run → Scroll down to **Artifacts** section
                
                📌 **Version:** ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
                
                ⏱️ **Build Time:** ${{ github.run_started_at }}`
              });
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue && context.issue.number;
            if (issueNumber) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ **Build Failed!** 
                
                Check the workflow logs for details: 
                https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            } else {
              core.info('Workflow failed, but context does not contain a PR/issue number to comment on.');
            }
