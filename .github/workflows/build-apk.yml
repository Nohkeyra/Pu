name: Build APK

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (only applied on main / manual runs that publish)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

# Serialize runs per ref so two pushes never bump the version at the same
# time. Releases queue (never cancelled mid-build); stale PR builds are cancelled.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for getting all tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # =============================================
      # 🔢 VERSION: resolve, bump, commit and push - BEFORE building anything
      # =============================================
      # Why this runs right after checkout (it used to run after the web
      # build + Capacitor sync):
      #   1. The bump script rewrites six files (version.properties x2,
      #      package.json, updateService.ts, updateRoutes.ts, server.ts) but
      #      only three used to be committed. The other three stayed dirty in
      #      the work tree, which is what made `git pull --rebase` abort with
      #      "cannot pull with rebase: You have unstaged changes" (exit 128)
      #      whenever a push was rejected.
      #   2. The web bundle was built BEFORE the bump, so the APK shipped the
      #      previous CURRENT_APP_VERSION / CURRENT_BUILD_NUMBER from
      #      updateService.ts. Bumping first fixes that too.
      #
      # Race handling is optimistic concurrency instead of rebase: the work
      # tree is clean here, so on every attempt we hard-reset to the latest
      # origin tip, re-derive the bump from THAT version, commit and push.
      # A rejected push just means someone else bumped first - the next
      # attempt bumps from their number. No rebase, no conflicts, no stash.
      - name: Resolve app version (bump + push on main/master)
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          IS_RELEASE: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail

          VERSION_FILES=(
            android/version.properties
            android/app/version.properties
            package.json
            src/services/updateService.ts
            server/routes/updateRoutes.ts
            server.ts
          )

          if [ "$IS_RELEASE" != "true" ]; then
            echo "ℹ️ Non-release build (PR / develop) - using current version, no bump"
            node scripts/bump-version.cjs show --ci
          elif [ "$BUMP" = "none" ]; then
            echo "ℹ️ Bump disabled - using current version"
            node scripts/bump-version.cjs show --ci
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            MAX_ATTEMPTS=5
            pushed=0
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              echo "⬆️ Bump attempt $attempt/$MAX_ATTEMPTS ($BUMP) on $BRANCH"

              # Always start from the latest remote state. Safe: nothing has
              # been built or generated yet, so there is nothing to lose.
              git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
              git reset --hard "origin/$BRANCH"

              node scripts/bump-version.cjs "$BUMP" --ci

              for f in "${VERSION_FILES[@]}"; do
                if [ -f "$f" ]; then git add -- "$f"; fi
              done

              if git diff --cached --quiet; then
                echo "::error::Version bump produced no file changes"
                exit 1
              fi

              NAME=$(sed -n 's/^versionName=//p' android/version.properties)
              CODE=$(sed -n 's/^versionCode=//p' android/version.properties)
              git commit -q -m "chore(release): bump version to $NAME ($CODE)"

              if git push origin "HEAD:refs/heads/$BRANCH"; then
                pushed=1
                break
              fi

              echo "⚠️ Push rejected (origin moved) - retrying from latest origin..."
              sleep $((attempt * 2))
            done

            if [ "$pushed" != "1" ]; then
              echo "::error::Could not push version bump after $MAX_ATTEMPTS attempts. Failing the run so a release is never built with an unpublished version number."
              exit 1
            fi
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "✅ Version ready: $(sed -n 's/^versionName=//p' android/version.properties) ($(sed -n 's/^versionCode=//p' android/version.properties))"
          echo "---- android/version.properties ----"
          cat android/version.properties || true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install -g @capacitor/cli

      - name: Patch capacitor-updater enum switch cases (Java 21 fix)
        run: |
          node scripts/patch-capacitor.js

      - name: Build web assets
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
          VITE_API_URL_ANDROID: https://restoran-wawasan-bio.onrender.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          WIDGET_API_KEY: ${{ secrets.WIDGET_API_KEY }}
        run: |
          npm run build || npm run build:prod
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist folder not found"
            exit 1
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android || {
            echo "⚠️ Capacitor sync failed, attempting to add android platform..."
            npx cap add android
            npx cap sync android
          }

      - name: Verify google-services.json
        run: |
          echo "Checking google-services.json..."
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ android/app/google-services.json exists."
            ls -la android/app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "⚠️ Restoring google-services.json from secret..."
            mkdir -p android/app
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json restored"
          else
            echo "❌ ERROR: android/app/google-services.json not found!"
            echo "📁 Directory listing:"
            ls -la android/app/ || echo "android/app directory missing"
            exit 1
          fi

      - name: Setup signing keystore
        # BUGFIX (2026-09-12): This step used to prefer RELEASE_KEYSTORE_BASE64
        # over ANDROID_KEYSTORE_BASE64 (and RELEASE_STORE_PASSWORD over
        # KEYSTORE_PASSWORD). RELEASE_KEYSTORE_BASE64 does not exist as a
        # repository secret (confirmed via repo Settings > Secrets), yet the
        # build log showed it evaluating to a non-empty value — meaning it
        # was being supplied by an org-level Actions secret invisible from
        # this repo's secrets page, containing a *different, stale* keystore
        # than the one KEYSTORE_PASSWORD actually matches. That mismatch is
        # what caused "keystore password was incorrect" on the release build.
        # Pinning this step to only the two secrets that are actually visible
        # and controlled here (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD)
        # removes that shadowing possibility entirely. The old "generate a
        # throwaway keystore if secrets are missing" fallback is also removed
        # for release builds — silently signing a release with a random new
        # key is worse than failing the build with a clear error.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:?❌ KEYSTORE_PASSWORD secret is not set}"
          KEY_PASS="${KEY_PASSWORD:?❌ KEY_PASSWORD secret is not set}"
          ALIAS="${KEY_ALIAS:?❌ KEY_ALIAS secret is not set}"
          KB64="${ANDROID_KEYSTORE_BASE64:?❌ ANDROID_KEYSTORE_BASE64 secret is not set}"

          mkdir -p android/app

          echo "🔑 Decoding production signing keystore from ANDROID_KEYSTORE_BASE64..."
          echo "$KB64" | base64 -d > android/app/release-key.jks

          echo "🔎 Verifying keystore opens with KEYSTORE_PASSWORD / KEY_ALIAS before building..."
          keytool -list -keystore android/app/release-key.jks -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null || {
            echo "❌ Could not open android/app/release-key.jks with the KEYSTORE_PASSWORD/KEY_ALIAS secrets."
            echo "   Check that ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_ALIAS all belong to the same keystore."
            exit 1
          }
          echo "✅ Keystore opened successfully — password and alias confirmed valid."

          echo "storePassword=$STORE_PASS" > android/app/key.properties
          echo "keyPassword=$KEY_PASS" >> android/app/key.properties
          echo "keyAlias=$ALIAS" >> android/app/key.properties
          echo "storeFile=release-key.jks" >> android/app/key.properties
          cp android/app/key.properties android/key.properties
          echo "✅ Keystore successfully configured for release signing!"

      - name: Setup Gradle permissions and wrapper integrity
        run: |
          cd android
          chmod +x gradlew
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "⚠️ gradle-wrapper.jar corrupted or invalid. Restoring official Gradle 8.11.1 wrapper jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
            unzip -t gradle/wrapper/gradle-wrapper.jar
          else
            echo "✅ Gradle wrapper jar verified."
          fi

      - name: Build debug APK
        working-directory: ./android
        env:
          WIDGET_API_KEY: ${{ secrets.WIDGET_API_KEY }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "❌ Debug build failed. Check logs above."
            exit 1
          }

      - name: Build release APK (signed)
        working-directory: ./android
        env:
          WIDGET_API_KEY: ${{ secrets.WIDGET_API_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || {
            echo "❌ Release build failed. Check logs above."
            exit 1
          }

      - name: Build Bundle (AAB for Play Store)
        working-directory: ./android
        env:
          WIDGET_API_KEY: ${{ secrets.WIDGET_API_KEY }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || {
            echo "⚠️ Bundle build failed (continuing)"
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # BUGFIX (2026-08-27): Gradle outputs the signed APK as
      # android/app/build/outputs/apk/release/app-release.apk. The
      # upload-artifact step below used "app-release-signed" only as its
      # display name — that never renamed the actual file. The GitHub
      # Release asset (created later by ncipollo/release-action) keeps
      # Gradle's original filename, but the live-update broadcast step
      # further down hardcodes the download URL as ".../app-release-signed.apk".
      # That filename never existed in the Release, so every broadcast to
      # /api/app-version/github-sync carried a 404 apkUrl. Renaming the real
      # file on disk here makes the artifact, the Release asset, and the
      # broadcast URL all refer to the same actual file.
      - name: Rename release APK to match broadcast URL
        working-directory: ./android/app/build/outputs/apk/release
        run: |
          for f in *.apk; do
            if [ "$f" != "app-release-signed.apk" ]; then
              echo "Renaming $f -> app-release-signed.apk"
              mv "$f" app-release-signed.apk
            fi
          done
          ls -la

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # =============================================
      # 🚀 CREATE GITHUB RELEASE
      # =============================================
      - name: Create GitHub Release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ## 📱 APK Release v${{ env.VERSION_NAME }}
            
            ### 📦 Downloads
            - **Signed APK:** Ready to install
            - **AAB Bundle:** For Play Store
            
            ### 📲 Installation
            1. Download the APK from assets below
            2. Enable "Install from unknown sources" on your device
            3. Install the APK
            
            ### 🎯 Build Information
            - **Version Name:** ${{ env.VERSION_NAME }}
            - **Version Code:** ${{ env.VERSION_CODE }}
            - **Commit:** ${{ env.RELEASE_SHA }}
            - **Branch:** ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # =============================================
      # 📡 AUTOMATIC LIVE UPDATE BROADCAST
      # =============================================
      - name: Trigger Automatic In-App Live Update Broadcast
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && success()
        env:
          SYNC_SECRET: ${{ secrets.RELEASE_SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "⚠️ RELEASE_SYNC_SECRET is not configured in GitHub Secrets. Skipping auto-sync."
          else
            echo "🚀 Broadcasting live app version update to Wawasan Hub..."
            curl -X POST "https://restoran-wawasan-bio.onrender.com/api/app-version/github-sync" \
              -H "Content-Type: application/json" \
              -H "x-github-token: $SYNC_SECRET" \
              -d "{\"version\":\"${{ env.VERSION_NAME }}\",\"buildNumber\":\"${{ env.VERSION_CODE }}\",\"apkUrl\":\"https://github.com/Nohkeyra/Pu/releases/download/v${{ env.VERSION_NAME }}/app-release-signed.apk\"}"
            echo "✅ Broadcast request completed successfully!"
          fi
