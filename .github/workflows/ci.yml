name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up npm 11.9.0
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up npm 11.9.0
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm test -- --run --coverage
      - run: npm run test:migrations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up npm 11.9.0
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            server-dist/
            client/dist/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up npm 11.9.0
        run: npm install --global npm@11.9.0
      - run: npm ci
      # Enforce the production dependency audit. Do not hide failures with continue-on-error.
      - run: npm audit --omit=dev --audit-level=high
      # Informational whole-repository scan: includes dev/build tooling dependencies.
      # Keep non-blocking until all development-toolchain advisories are remediated.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          
