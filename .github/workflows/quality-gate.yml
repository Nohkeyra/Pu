# .github/workflows/quality-gate.yml
name: Professional Quality & Security Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x"] # Adjust to your target versions

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Lint with ESLint (Stop on syntax errors)
      run: npm run lint

    - name: Run Security Check (Audit)
      run: |
        # Checks dependencies for known vulnerabilities
        npm audit --audit-level=high || echo "⚠️ Security vulnerabilities found in dependencies!"

    - name: Build and Verify
      run: npm run build
