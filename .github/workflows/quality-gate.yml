# .github/workflows/quality-gate.yml
name: Professional Quality & Security Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Lint with ESLint (Stop on syntax errors)
      run: npm run lint

    - name: Run Security Check (Block on production critical only)
      # Keep the gate focused on release-blocking runtime risk.
      #
      # - Blocking check: production dependencies, CRITICAL only.
      # - Visibility check: print the full production audit report, but do not
      #   fail the workflow on currently accepted high/moderate findings until
      #   the dependency remediation work is scheduled.
      run: |
        npm audit --omit=dev --audit-level=critical
        npm audit --omit=dev || true

    - name: Build and Verify
      run: npm run build
