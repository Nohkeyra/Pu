name: ESLint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * 6'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up npm 11.9.0
        run: npm install --global npm@11.9.0

      - run: npm ci

      - name: Install SARIF formatter
        run: npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        id: eslint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: >-
          npx eslint .
          --config eslint.config.js
          --ext .js,.jsx,.ts,.tsx
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

      # ESLint step above is non-blocking so SARIF is always uploaded; fail the job here if ESLint itself failed.
      - name: Fail if ESLint reported errors
        if: steps.eslint.outcome == 'failure'
        run: exit 1
