name: App Integrity QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Full app browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu24-chromium-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Full suite includes app-integrity and delete-account; no duplicate execution.
      - run: npx playwright test --project=chromium --workers=2 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-integrity-browser-failure
          path: test-results/
          retention-days: 7
