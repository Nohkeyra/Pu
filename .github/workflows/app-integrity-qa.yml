name: App Integrity QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Full app browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check integrity scenarios first
        run: npx playwright test e2e/app-integrity.spec.ts e2e/delete-account.spec.ts --project=chromium --workers=2 --retries=0 --reporter=line
      - run: npx playwright test --project=chromium --workers=2 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-integrity-browser-failure
          path: test-results/
          retention-days: 7
