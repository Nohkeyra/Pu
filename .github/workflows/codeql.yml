name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '35 17 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore Firebase configuration for Android CodeQL build
        if: matrix.language == 'java-kotlin'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -s android/app/google-services.json ]; then
            if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required for the Android CodeQL build."
              exit 1
            fi
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          node -e 'const c = require("./android/app/google-services.json"); if (!c.client?.some(x => x.client_info?.android_client_info?.package_name === "com.wawasanpakusop.app")) { console.error("Invalid Firebase Android package configuration"); process.exit(1) }'

      - name: Build Android app
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          npm run build
          test -f dist/index.html
          node scripts/patch-capacitor.js
          npx cap sync android
          cd android
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          
