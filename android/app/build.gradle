apply plugin: 'com.android.application'

def keyPropertiesFile = rootProject.file('key.properties')
if (!keyPropertiesFile.exists()) {
    keyPropertiesFile = file('key.properties')
}
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
} else {
    // Fallback to environment variables for secure CI/CD builds
    keyProperties['storeFile'] = System.getenv('RELEASE_STORE_FILE') ?: 'release-key.jks'
    keyProperties['storePassword'] = System.getenv('RELEASE_STORE_PASSWORD') ?: ''
    keyProperties['keyAlias'] = System.getenv('RELEASE_KEY_ALIAS') ?: ''
    keyProperties['keyPassword'] = System.getenv('RELEASE_KEY_PASSWORD') ?: ''
}

def versionPropertiesFile = rootProject.file('version.properties')
def versionProperties = new Properties()
if (versionPropertiesFile.exists()) {
    versionProperties.load(new FileInputStream(versionPropertiesFile))
}

def appVersionCode = versionProperties['versionCode'] ? versionProperties['versionCode'].toInteger() : 125
def appVersionName = versionProperties['versionName'] ?: "1.2.5"

android {
    namespace "com.wawasanpakusop.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.wawasanpakusop.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Pricing widget's shared-secret key — must match WIDGET_API_KEY on
        // Render.  Read from CI env var (GitHub Actions secret), same pattern
        // as RELEASE_STORE_PASSWORD above.  Falls back to empty string if
        // unset, which makes the widget's checkWidgetKey() reject all
        // requests server-side (fail-closed) rather than silently working
        // with a blank key.
        buildConfigField "String", "WIDGET_API_KEY", "\"${System.getenv('WIDGET_API_KEY') ?: ''}\""

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storeFilePath = keyProperties['storeFile'] ?: 'release-key.jks'
            def keystoreFile = rootProject.file(storeFilePath)
            if (!keystoreFile.exists()) {
                keystoreFile = file(storeFilePath)
            }
            if (keystoreFile.exists() && keyProperties['storePassword'] && keyProperties['keyAlias'] && keyProperties['keyPassword']) {
                storeFile keystoreFile
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE',
                '/META-INF/LICENSE.txt',
                '/META-INF/license.txt',
                '/META-INF/NOTICE',
                '/META-INF/NOTICE.txt',
                '/META-INF/notice.txt',
                '/META-INF/ASL2.0',
                '/META-INF/*.kotlin_module'
            ]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.15.0')

    // Add the dependencies for Firebase products you want to use
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Firebase BoM 34.15.0 transitively pulls androidx.browser:browser:1.9.0 and okhttp-android:5.4.0,
    // which requires compileSdk 36+ / AGP 8.9.1+.
}

apply from: 'capacitor.build.gradle'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

tasks.register("printFingerprint") {
    doLast {
        def javaHome = System.getProperty("java.home")
        def keytoolName = System.getProperty("os.name").toLowerCase().contains("win") ? "keytool.exe" : "keytool"
        def keyTool = new File(javaHome, "bin/" + keytoolName)
        def keystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
        
        if (!keystore.exists()) {
            println "------------------------------------------------------------"
            println "DEBUG KEYSTORE NOT FOUND"
            println "Expected path: ${keystore.absolutePath}"
            println "Please make sure you have run the app at least once on an emulator/device,"
            println "or generated a debug build, so that Android SDK creates the default debug.keystore."
            println "------------------------------------------------------------"
            return
        }
        
        println "Executing keytool to fetch certificate fingerprints..."
        def storePass = System.getenv("DEBUG_KEYSTORE_PASS") ?: "android"
        exec {
            commandLine keyTool.absolutePath, "-list", "-v", "-alias", "androiddebugkey", "-keystore", keystore.absolutePath, "-storepass", storePass
        }
    }
}
