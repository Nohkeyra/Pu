apply plugin: 'com.android.application'

android {
    namespace "com.wawasanpakusop.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wawasanpakusop.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // F-34 (audit, confirmed by Noh 2026-07-27): enabled after adding
            // explicit -keep rules in proguard-rules.pro for the widget
            // package, MainActivity, and ShareUtils — these are referenced
            // only by fully-qualified name from AndroidManifest.xml /
            // RemoteViewsService intents, not by direct code references R8
            // can trace, so without those keep rules this would silently
            // break the home-screen widget in release builds.
            // shrinkResources requires minifyEnabled and further reduces APK
            // size by stripping unused resources alongside unused code.
            //
            // ACTION REQUIRED before shipping a release build: install an
            // actual app-release(-signed).apk on-device and verify the
            // home-screen widget still renders/updates/opens the app
            // correctly. A successful `assembleRelease` does not prove this
            // — R8 stripping is a runtime-only failure mode.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.15.0')

    // Add the dependencies for Firebase products you want to use
    implementation 'com.google.firebase:firebase-analytics'

    // Firebase BoM 34.15.0 transitively pulls androidx.browser:browser:1.9.0,
    // which requires compileSdk 36+ / AGP 8.9.1+. We have upgraded these
    // in variables.gradle and build.gradle to maintain compatibility.
}

apply from: 'capacitor.build.gradle'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

apply plugin: 'com.google.gms.google-services'

tasks.register("printFingerprint") {
    doLast {
        def javaHome = System.getProperty("java.home")
        def keytoolName = System.getProperty("os.name").toLowerCase().contains("win") ? "keytool.exe" : "keytool"
        def keyTool = new File(javaHome, "bin/" + keytoolName)
        def keystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
        
        if (!keystore.exists()) {
            println "------------------------------------------------------------"
            println "DEBUG KEYSTORE NOT FOUND"
            println "Expected path: ${keystore.absolutePath}"
            println "Please make sure you have run the app at least once on an emulator/device,"
            println "or generated a debug build, so that Android SDK creates the default debug.keystore."
            println "------------------------------------------------------------"
            return
        }
        
        println "Executing keytool to fetch certificate fingerprints..."
        def storePass = System.getenv("DEBUG_KEYSTORE_PASS") ?: "android"
        exec {
            commandLine keyTool.absolutePath, "-list", "-v", "-alias", "androiddebugkey", "-keystore", keystore.absolutePath, "-storepass", storePass
        }
    }
}
